<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fotogalerie von Volker Hohl">
  <title>Meine Bilder – www.volker-hohl.de</title>
  <style>
    :root { --accent:#a70d01; --bg:#f7f3ed; --card:#fff; --text:#252525; --muted:#777; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; color:var(--text); background:var(--bg); }
    header { background:linear-gradient(135deg,#8d0b02,#c42a1d); color:white; padding:22px 18px; box-shadow:0 3px 15px #0002; }
    header .inner { max-width:1100px; margin:auto; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    h1 { margin:0; font-size:clamp(24px,5vw,38px); }
    .back { color:white; text-decoration:none; border:1px solid #fff8; padding:10px 14px; border-radius:10px; }
    .back:hover { background:#fff2; }
    main { max-width:1100px; margin:0 auto; padding:30px 18px 50px; }
    .intro { margin-bottom:24px; }
    .intro p { color:var(--muted); }
    .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
    .photo { margin:0; background:var(--card); border-radius:14px; overflow:hidden; box-shadow:0 3px 14px #0001; cursor:pointer; transition:transform .2s, box-shadow .2s; }
    .photo:hover { transform:translateY(-4px); box-shadow:0 8px 25px #0002; }
    .photo img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#eee; }
    .caption { padding:10px 12px; font-size:14px; }
    .empty { padding:35px 20px; text-align:center; background:white; border-radius:14px; color:var(--muted); }
    .empty strong { color:var(--text); }
    .lightbox { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:#000d; padding:20px; z-index:10; }
    .lightbox.open { display:flex; }
    .lightbox img { max-width:95vw; max-height:88vh; object-fit:contain; border-radius:8px; }
    .close { position:fixed; top:15px; right:20px; color:white; background:#fff2; border:0; border-radius:50%; width:44px; height:44px; font-size:28px; cursor:pointer; }
    @media (max-width:600px) { .gallery { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; } .photo { border-radius:10px; } header .inner { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <h1>Meine Bilder</h1>
      <a class="back" href="../index.html">← Zur Startseite</a>
    </div>
  </header>

  <main>
    <div class="intro">
      <h2>Fotogalerie</h2>
      <p>Lege einfach Bilder in den Ordner <code>meine Bilder/bilder/</code>. Die Galerie wird auf GitHub automatisch aktualisiert.</p>
    </div>

    <section id="gallery" class="gallery" aria-label="Fotogalerie"></section>
  </main>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Bildansicht">
    <button class="close" aria-label="Schließen">×</button>
    <img id="lightboxImage" alt="">
  </div>

  <script>
    async function loadGallery() {
      const gallery = document.getElementById('gallery');
      try {
        const response = await fetch('bilder.json?cache=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('bilder.json konnte nicht geladen werden.');
        const data = await response.json();
        const images = Array.isArray(data.bilder) ? data.bilder : [];

        if (!images.length) {
          gallery.innerHTML = '<div class="empty"><strong>Noch keine Bilder vorhanden.</strong><br>Lege einfach Bilder in <code>meine Bilder/bilder/</code>. GitHub Actions erstellt die Galerie-Liste automatisch.</div>';
          return;
        }

        for (const item of images) {
          const src = 'bilder/' + encodeURI(item.dateiname);
          const figure = document.createElement('figure');
          figure.className = 'photo';
          figure.innerHTML = `<img src="${src}" alt=""><figcaption class="caption"></figcaption>`;
          figure.querySelector('img').alt = item.alt || item.titel || item.dateiname;
          figure.querySelector('.caption').textContent = item.titel || item.dateiname;
          figure.addEventListener('click', () => openLightbox(src, figure.querySelector('img').alt));
          gallery.appendChild(figure);
        }
      } catch (error) {
        gallery.innerHTML = '<div class="empty">Die Galerie konnte nicht geladen werden.</div>';
        console.error(error);
      }
    }

    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    function openLightbox(src, alt) {
      lightboxImage.src = src;
      lightboxImage.alt = alt;
      lightbox.classList.add('open');
    }
    function closeLightbox() { lightbox.classList.remove('open'); lightboxImage.src = ''; }
    document.querySelector('.close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
    loadGallery();
  </script>
</body>
</html>
