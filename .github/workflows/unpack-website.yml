name: Website aus ZIP bereitstellen

on:
  push:
    paths:
      - "website.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: ZIP entpacken
        run: |
          mkdir -p website
          unzip -o website.zip -d website

      - name: Website ins Hauptverzeichnis kopieren
        run: |
          cp -r website/* .
          rm -rf website

      - name: ZIP und temporäre Dateien entfernen
        run: |
          rm -f website.zip

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Website automatisch aus ZIP entpackt"
          git push
